name: Lint

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@v5
      - name: Check bash syntax
        run: bash -n reboot_router.sh
      - name: Run shellcheck
        run: shellcheck reboot_router.sh
